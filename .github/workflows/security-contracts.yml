name: Security contract checks

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contracts:
    name: Security contract regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check implementation invariants and claim boundaries
        run: python3 scripts/check-security-contracts.py
